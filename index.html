<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>코어브레이커2 : 와장창 던전</title>
<style>
html,body{margin:0;height:100%;background:#0a0810;overflow:hidden;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#120f16}
#c{display:block;width:100%;height:100%;cursor:none}
.hud{position:absolute;color:#fff;text-shadow:0 1px 3px #000;font-weight:700;pointer-events:none}
#tl{left:1.2%;top:2%;font-size:2.6vmin;line-height:1.35}
#tl small{font-weight:500;opacity:.85;font-size:2.1vmin}
#tr{right:1.2%;top:25vmin;font-size:3vmin;background:rgba(0,0,0,.45);padding:.4vmin 2vmin;border-radius:3vmin}
#tc{left:50%;top:2%;transform:translateX(-50%);text-align:center;font-size:2.3vmin;background:rgba(0,0,0,.5);padding:.6vmin 2.4vmin;border-radius:2vmin}
#cross{width:4.4vmin;height:4.4vmin;margin:-2.2vmin 0 0 -2.2vmin;border:2px solid #fff;border-radius:50%;opacity:.9;left:50%;top:50%}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#bot{left:50%;bottom:2%;transform:translateX(-50%);font-size:2vmin}
#bot div{background:rgba(0,0,0,.5);padding:.8vmin 2.2vmin;border-radius:1.6vmin;border:2px solid #ffd54a}
.pop{position:absolute;color:#ffd54a;font-weight:800;font-size:3vmin;text-shadow:0 1px 3px #000;pointer-events:none;transition:transform .9s ease-out,opacity .9s ease-out}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,6,12,.78);color:#fff;text-align:center;z-index:5}
#ov .box{max-width:520px;max-height:92vh;overflow:auto;padding:24px 28px;background:#221c2b;border:2px solid #ffd54a;border-radius:16px}
#ov h1{margin:0 0 8px;font-size:26px}#ov p{margin:6px 0;line-height:1.5;font-size:16px}
#ov .box{max-width:min(96vw,760px);padding:clamp(10px,2.2vh,22px) clamp(12px,2.5vw,26px)}
#ov h1{font-size:clamp(18px,4vh,26px)}#ov p{font-size:clamp(12px,2.6vh,16px);margin:4px 0}
@media (max-height:640px){#ov p{line-height:1.3;margin:3px 0}#ov .box{max-height:97vh}#ov .cards button{padding:4px 10px}}
#ov .coinline{font-size:clamp(13px,2.6vh,16px);margin:6px 0}
#ov .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
#ov .card .cd:nth-of-type(2){font-size:11px}
@media (max-height:640px){#ov .card .cn+.cd{display:none}#ov .card .cd{font-size:11px;line-height:1.2}}
#ov button#go,#ov button#again{position:sticky;bottom:0;z-index:2;box-shadow:0 0 0 6px #221c2b}
#ov .card{background:#2e2639;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
#ov .cn{font-weight:800;font-size:clamp(13px,2.8vh,16px)}#ov .cn span{color:#ffd54a;font-size:.9em}
#ov .cd{font-size:clamp(12px,2.4vh,14px);opacity:.85;line-height:1.3;flex:1}
#ov .cm{font-weight:800;color:#8f8}
#ov .up{margin-top:2px;font-size:clamp(13px,2.7vh,16px);padding:6px 12px;border-radius:10px}
#ov .up:disabled{opacity:.4}
#ov .mods{display:flex;gap:4px;justify-content:center;margin:2px 0}#ov .md{margin:0;padding:3px 7px;font-size:clamp(11px,2.3vh,13px);border-radius:8px}#ov .md.on{outline:2px solid #ffd54a}#ov .md:disabled{opacity:.4}#ov .sep{display:none}@media (max-height:640px){#ov .sep{display:inline}}@media (max-height:430px){#ov .msd{display:none}#ov .box.showpk .msd{display:inline}#ov .sp{font-size:10px!important;padding:3px 6px!important}#ov .se{font-size:10px!important;padding:3px 5px!important}#ov .sup{gap:3px}#ov .card{padding:4px 5px}#ov .md{font-size:11px!important}#ov .ms,#ov .up{padding:3px 6px!important;font-size:12px!important}#ov .sup b{font-size:11px}}
@media (max-height:380px){#ov h1{font-size:15px!important;margin:0!important}#ov p{font-size:11px!important;margin:1px 0!important}#ov .coinline{font-size:11px!important;margin:0!important}#ov .recbtn,#ov .pkbtn{padding:2px 8px!important}#ov .alt{padding:3px 10px!important}}
#ov .sg{display:inline-flex;gap:2px;align-items:center}#ov .se{margin:0;padding:4px 7px;font-size:clamp(11px,2.2vh,12px);border-radius:8px}#ov .se.on{outline:2px solid #ffd54a}#ov .ms{margin-top:2px;font-size:clamp(12px,2.5vh,14px);padding:5px 8px;border-radius:10px}#ov .ms:disabled{opacity:.4}#ov .pkbtn{display:none;margin-top:4px;font-size:12px;padding:3px 10px;background:#5b4a7a;color:#fff}@media (max-height:640px){#ov .pkbtn{display:inline-block}#ov .recbtn{margin-top:2px;padding:3px 10px;font-size:12px}#ov p br{display:none}#ov .sup{margin-top:2px}#ov .box{padding-top:4px!important;padding-bottom:4px!important}#ov .alt{padding:5px 12px!important;font-size:14px!important}}
@media (max-height:640px){#ov .pk{display:none}#ov .box.showpk .pk{display:block}#ov .mh,#ov .nv,#ov .dex{display:none}#ov p{font-size:12px}#ov .cards .cd{font-size:11px;line-height:1.15}}
#ov .sup{margin-top:6px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:clamp(11px,2.2vh,13px)}#ov .sup b{width:100%}#ov .sp{margin:0;padding:4px 8px;font-size:clamp(11px,2.3vh,13px);border-radius:8px;background:#5b4a7a;color:#fff}#ov .sp small{display:none}#ov .sp:disabled{opacity:.45}
#ov .dex{margin-top:8px;font-size:clamp(11px,2.2vh,13px);opacity:.85}
#ov button#go,#ov button#again{margin-top:10px;padding:8px 26px;font-size:clamp(15px,3.2vh,18px)}
#ov .box.showrec p,#ov .box.showrec .cards,#ov .box.showrec .dex,#ov .box.showrec .coinline{display:none}#ov .box.showrec h1{font-size:clamp(16px,3.4vh,22px)}
#ov .recbtn{margin-top:6px;font-size:clamp(12px,2.4vh,14px);padding:4px 12px;background:#5b4a7a;color:#fff}
#ov .rg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px;font-size:clamp(10px,2vh,12px)}#ov .rg b{display:block;font-size:clamp(13px,2.8vh,16px);color:#ffd54a}
#ov table{width:100%;margin-top:6px;font-size:clamp(11px,2.1vh,13px);border-collapse:collapse}#ov td,#ov th{padding:1px 4px;border-bottom:1px solid #443a55}
#ov .zones{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}#ov .zones .zb{margin:0;padding:4px 2px;font-size:clamp(11px,2.2vh,13px);border-radius:8px;background:#3a3149;color:#fff;font-weight:600}#ov .zones .zb.cur{background:#ffd54a;color:#2a1f00}#ov .zones .zb:disabled{opacity:.35}
#ov .box.showrec .zones{display:none}
#ov button.alt{font-size:clamp(13px,2.8vh,16px);padding:8px 14px}
@media (max-height:430px){#ov .card .cn+.cd{display:none}#ov .box{max-height:94vh!important;padding-top:6px!important;padding-bottom:6px!important}#ov h1{font-size:18px!important}#ov .cards{grid-template-columns:repeat(5,1fr)}#ov .card .cd:nth-of-type(1){font-size:10px}#ov .dex{display:none}#ov .coinline{display:block!important;margin:2px 0;font-size:13px}#ov .box{max-height:96vh}#ov .rules{display:none}#ov .zones{grid-template-columns:repeat(8,1fr);gap:3px}#ov .zones .zb{font-size:10px;padding:3px 0}#ov .box{padding-top:8px;padding-bottom:8px}#ov h1{margin-bottom:2px}}
#ov button{margin-top:14px;font-size:18px;padding:10px 26px;border-radius:12px;border:0;background:#ffd54a;color:#2a1f00;font-weight:800}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0a0810;color:#fff;font-size:20px;z-index:9;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
#err{position:fixed;left:0;bottom:0;color:#f88;font-size:10px;z-index:99}
#tm{position:fixed;right:1.2%;top:1.5%;z-index:4;text-align:right;pointer-events:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.55);padding:.8vmin 2.4vmin;border-radius:2vmin;border:1px solid rgba(255,255,255,.18)}
#pzb{position:absolute;left:-7.5vmin;top:0;width:6.5vmin;height:6.5vmin;min-width:34px;min-height:34px;left:calc(-1 * max(7.5vmin,40px));border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.6);color:#fff;font-size:2.4vmin;pointer-events:auto;padding:0}
#tms{font-size:1.7vmin;color:#9ab;opacity:.85}
#tmb{font-size:2.4vmin;color:#ffd54a;letter-spacing:.1em}
#tmc{font-size:8vmin;font-weight:800;line-height:1.05;color:#fff;min-width:23vmin;text-shadow:0 0 1.2vmin rgba(120,200,255,.7);transition:color .2s}
#tmd{font-size:2.6vmin;min-height:3vmin;color:#8f8}
#tmc.idle{opacity:.5}#tmc.warm{color:#ffe36a}#tmc.hot{color:#ff9a3a;animation:tmp .5s infinite}#tmc.over,#tmd.over{color:#ff4a4a;animation:tmp .3s infinite}#tmc.fin{color:#cfe}#tmc.rec{color:#ffd54a;text-shadow:0 0 2.5vmin #ffd54a;animation:tmp .6s infinite}
#tmd.warm,#tmd.hot{color:#ffb050}#tmd.over{color:#ff4a4a}#tmd.rec{color:#ffd54a;font-weight:800}#tmd.fin{color:#ff8a8a}
@keyframes tmp{50%{transform:scale(1.04)}}
</style></head><body>
<div id="stage"><canvas id="c"></canvas>
<div class="hud" id="tl"></div><div class="hud" id="tr">이번 수입 0</div><div class="hud" id="tc"></div>
<div class="hud" id="cross"></div>
<div id="keys" style="position:absolute;right:8px;bottom:8px;z-index:3;padding:5px 9px;border-radius:10px;background:rgba(0,0,0,.45);color:#ddd;font-size:13px;pointer-events:none">1·2·3 탄종 / R 장전</div><div id="mute" style="position:absolute;left:8px;bottom:8px;z-index:4;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer;pointer-events:auto">소리 켬</div><div class="hud" id="bot"><div>기본탄</div></div></div>
<div id="ov"><div class="box"></div></div>
<div id="rot">휴대폰을 가로로 돌려 주세요</div><div id="err"></div>
<script>window.onerror=(m,s,l)=>{document.getElementById('err').textContent+=m+'@'+l+' '}</script>
<script type="module" src="game.js"></script>
</body></html>
