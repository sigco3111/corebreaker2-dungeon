<!doctype html><meta charset="utf-8"><title>cap</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{position:fixed;inset:0;width:100vw;height:100vh;border:0}</style><iframe id=f></iframe><script>
// #act=start|clear&visits=all1|final|none&zone=2&ms=98
const P = Object.fromEntries(location.hash.slice(1).split('&').map(s => s.split('=')));
const seed = {};
if (P.visits === 'all1') seed.visits = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1, 7: 1, 8: 1 };
if (P.visits === 'final') seed.visits = { 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1, 7: 1 };
if (P.ms) { seed.ms = [+P.ms, 12, 0, 0, 0]; seed.wl = [10, 10, 10, 10, 10]; seed.wu = [1, 1, 1, 1, 1]; seed.coins = 3e8; }
localStorage.setItem('cb2.save.v1', JSON.stringify(seed));
const f = document.getElementById('f');
f.src = '../index.html?zone=' + (P.zone || 2) + '&mode=summon';
setTimeout(() => {
  try {
    if (P.act === 'clear') f.contentWindow.__cb2.showResult();
    document.title = 'ready';
  } catch (e) { document.title = 'err:' + e.message; }
}, 5000);
</script>
