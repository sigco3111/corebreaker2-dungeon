<!doctype html><meta charset="utf-8"><title>run</title><iframe id=f style="position:fixed;inset:0;width:100vw;height:100vh;border:0"></iframe><script>
const SEED={wl:[10,1,1,1,1],wu:[1,1,1,1,1],ms:[0,0,0,0,0],coins:500000,plays:3,sup:{},eq:{},mu:{},md:[0,0,0,0,0],visits:{1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:1},led:{}};
localStorage.setItem('cb2.save.v1',JSON.stringify(SEED));
const f=document.getElementById('f');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rd=()=>JSON.parse(localStorage.getItem('cb2.save.v1'));
setTimeout(async()=>{const out={steps:[]};try{
f.src='../index.html';await sleep(4500);
const d=f.contentDocument,w=f.contentWindow;
const coins0=rd().coins;
const click=sel=>{const b=d.querySelector(sel);if(!b)return 'missing:'+sel;if(b.disabled)return 'disabled:'+sel;b.click();return 'ok';};
out.steps.push(['up',click('.card .up, .card button.up')]);await sleep(300);
out.steps.push(['ms',click('.card .ms')]);await sleep(300);
out.steps.push(['md',click('.card .md:not(.on)')]);await sleep(300);
out.steps.push(['sp',click('.sp')]);await sleep(300);
out.steps.push(['se',click('.se')]);await sleep(300);
const s1=rd();out.afterBuy={wl0:s1.wl[0],ms0:s1.ms[0],mu01:s1.mu['0:1']||0,md0:s1.md[0],sup:s1.sup,eq:s1.eq,coins:s1.coins,spent:coins0-s1.coins};
// reload persistence
f.src='../index.html';await sleep(4500);
const s2=rd();out.afterReload={wl0:s2.wl[0],ms0:s2.ms[0],mu01:s2.mu['0:1']||0,md0:s2.md[0],rl:s2.sup.rl||0,eq:s2.eq,coins:s2.coins};
// start click
const go=f.contentDocument.getElementById('go');const r=go.getBoundingClientRect();
go.dispatchEvent(new f.contentWindow.PointerEvent('pointerdown',{bubbles:true}));go.click();await sleep(1500);
out.start={ov:f.contentDocument.getElementById('ov').style.display,bodyOv:f.contentDocument.body.classList.contains('ovon'),tr:f.contentWindow.getComputedStyle(f.contentDocument.getElementById('tr')).display};
document.title='done:'+JSON.stringify(out);}catch(e){document.title='err:'+e.message;}},100);
</script>
