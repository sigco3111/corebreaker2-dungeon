<!doctype html><body><iframe id=f src="http://localhost:8765/index.html?visit=3" width=1266 height=585></iframe><script>
const f=document.getElementById('f'); const log=[];
f.onload=()=>setTimeout(async()=>{
 const w=f.contentWindow, d=f.contentDocument; d.getElementById('go').click();
 const g=w.__cb2; const cv=d.querySelector('canvas'); const rect=cv.getBoundingClientRect();
 const adv=(s)=>{for(let k=0;k<s*30;k++)g.sim(1/30)};
 const G=g.GS; log.push({types:G.map(x=>x.name)});
 const xs=G.map(()=>[]); for(let i=0;i<14;i++){adv(.5); G.forEach((x,j)=>xs[j].push(+x.off.toFixed(2)));} log.push({sway:xs});
 const gg=G[0], K=gg.K;
 let n=0; while(gg.gmode!=='block'&&n++<600) adv(.05);
 const front=(c)=>{let hi=-1,mz=-1e9; for(let i=0;i<K.n;i++) if(K.alive[i]&&K.cat[i]==c&&K.pos[i*3+2]>mz){mz=K.pos[i*3+2];hi=i} return hi};
 const shoot=(i)=>{const p=new g.cam.position.constructor(K.pos[i*3]+gg.off,K.pos[i*3+1],K.pos[i*3+2]); const v=p.project(g.cam); const x=rect.left+(v.x+1)/2*rect.width,y=rect.top+(1-v.y)/2*rect.height; adv(.3); cv.dispatchEvent(new w.PointerEvent('pointerdown',{clientX:x,clientY:y,bubbles:true})); };
 const hp0=gg.PARTS[1].hp,d0=g.deflects; shoot(front(1)); adv(.5);
 log.push({blockShot:{deflectsDelta:g.deflects-d0,partHpDelta:hp0-gg.PARTS[1].hp,mode:gg.gmode}});
 n=0; while(gg.gmode!=='open'&&n++<600) adv(.05);
 let hits=0,tries=0; for(let t=0;t<8;t++){ adv(.3); const hi=front(1); if(hi<0)break; const hp=gg.PARTS[1].hp; if(gg.gmode!=='open')continue; tries++; shoot(hi); adv(.5); if(gg.PARTS[1].hp<hp||!gg.PARTS[1].alive)hits++; }
 log.push({openShots:{tries,hits,alive:gg.PARTS[1].alive}});
 document.title='RES'+JSON.stringify(log);
},1200);
</script>
