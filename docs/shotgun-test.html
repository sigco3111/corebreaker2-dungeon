<!doctype html><title>run</title><iframe id=f src="../index.html?visit=1&g=knight,barbarian,mage" width=800 height=450></iframe><script>
const f=document.getElementById('f');
setTimeout(()=>{const C=f.contentWindow.__cb2;C.selectWeapon(1);const g=C.GS[0];const c=g.CORE;
const res=[];const p=C.projectPoint(g.off+c.x,c.y,c.z);
for(const dx of [0,.1,.2,.3,.5]){C.update(2.5);const h0=C.hits;C.fire(p[0]+dx,p[1]);const n=C.flying.length;const w=C.flying.filter(q=>q.hits.some(h=>h.kind==='knight'||h.kind==='core')).length;
 for(let i=0;i<20;i++)C.update(.05);res.push('dx'+dx+': '+w+'/'+n+' landed '+(C.hits-h0));}
document.title='done:'+res.join(' | ');},3000);
</script>
